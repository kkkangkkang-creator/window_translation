name: Build Windows Release

on:
  push:
    tags: ['v*']
    branches: ['codex/windows-portable']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tesseract
        run: choco install tesseract --version=5.5.0.20241111 -y --no-progress
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11,<7" pytest
      - name: Prepare bundled OCR and languages
        run: ./scripts/bundle_ocr.ps1
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Build portable EXE
        run: python -m PyInstaller --clean --noconfirm window_translation.spec
      - name: Test packaged EXE and real OCR
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $report = Join-Path $pwd 'smoke-test.json'
          $p = Start-Process -FilePath 'dist/window_translation/window_translation.exe' -ArgumentList "--self-test `"$report`"" -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw 'Packaged EXE timed out' }
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Packaged EXE failed' }
          if (!(Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'Smoke test failed' }
      - name: Package portable folder
        shell: pwsh
        run: |
          Copy-Item QUICKSTART.txt dist/window_translation/
          python -m pip freeze | Out-File -Encoding utf8 dist/window_translation/BUILD-DEPENDENCIES.txt
          Copy-Item smoke-test.json dist/window_translation/
          Compress-Archive -Path dist/window_translation -DestinationPath dist/window_translation-windows-x64.zip -Force
          (Get-FileHash dist/window_translation-windows-x64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii dist/window_translation-windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: window_translation-windows-x64
          path: |
            dist/window_translation-windows-x64.zip
            dist/window_translation-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Publish tested preview
        if: github.ref == 'refs/heads/codex/windows-portable' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.2.1-preview' }}
          target_commitish: ${{ github.sha }}
          name: Window Translation — Windows portable preview
          prerelease: true
          body: |
            Windows 10/11 x64용 미리보기입니다. 아래 window_translation-windows-x64.zip을 내려받아 전체 압축 해제한 뒤 EXE를 실행하세요.
            Tesseract와 영어·일본어·중국어 언어 데이터가 포함되어 있습니다. Python 설치는 필요 없습니다.
            설정에서 번역 제공자와 모델 및 API 키를 입력하세요. 자세한 방법은 ZIP의 QUICKSTART.txt에 있습니다.
            이 빌드는 EXE 시작, Qt 위젯 생성, 실제 영어 OCR을 자동 검사합니다. 실제 게임 캡처와 온라인 번역은 사용자 환경에서 확인이 필요합니다.
          files: |
            dist/window_translation-windows-x64.zip
            dist/window_translation-windows-x64.zip.sha256
